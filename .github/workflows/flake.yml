# Builds the Nix flake for every supported system on push.
#
# Each system builds natively on a runner of its own architecture:
#   x86_64-linux   -> ubuntu-latest
#   aarch64-linux  -> ubuntu-24.04-arm
#   x86_64-darwin  -> macos-13 (Intel)
#   aarch64-darwin -> macos-latest (Apple Silicon)
#
# Native builds keep this simple: every dependency (PySide6, ffmpeg,
# tesseract, ...) comes from cache.nixos.org, and only the small custom
# derivations in flake.nix are built locally. (linux -> aarch64/darwin
# cross-compilation is not viable for Qt/PySide6 in nixpkgs 25.05, so no
# cross jobs are used.)
#
# Installer notes (nix 2.35.x):
#   - flakes and nix-command are stable by default; no experimental
#     feature flags needed.
#   - `--no-daemon` (single-user) is only valid on Linux; macOS installs
#     multi-user (daemon) by default and needs sudo (available on GHA).
#   - `--yes` accepts all prompts non-interactively.
name: flake

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        env:
          # Skip subscribing to the nixpkgs channel (we only need the
          # nix command; saves several minutes per job).
          NIX_INSTALLER_NO_CHANNEL_ADD: 1
        run: |
          curl -fsSL https://nixos.org/nix/install -o /tmp/nix-install
          if [ "$(uname -s)" = "Darwin" ]; then
            sh /tmp/nix-install --yes
          else
            sh /tmp/nix-install --no-daemon --yes
          fi
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          # Fallback: the real location nix was installed to, in case the
          # per-user profile symlink is missing/broken on this runner.
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          # Fail this step (not the next one) if the install did not land.
          "$HOME/.nix-profile/bin/nix" --version || {
            echo "::error::nix missing after install"
            ls -la "$HOME" || true
            ls -la /nix || true
            exit 1
          }

      - name: Check flake
        run: |
          command -v nix || { echo "::error::nix not on PATH: $PATH"; exit 99; }
          nix flake check

  build:
    name: build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-13
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        env:
          # Skip subscribing to the nixpkgs channel (we only need the
          # nix command; saves several minutes per job).
          NIX_INSTALLER_NO_CHANNEL_ADD: 1
        run: |
          curl -fsSL https://nixos.org/nix/install -o /tmp/nix-install
          if [ "$(uname -s)" = "Darwin" ]; then
            sh /tmp/nix-install --yes
          else
            sh /tmp/nix-install --no-daemon --yes
          fi
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          # Fallback: the real location nix was installed to, in case the
          # per-user profile symlink is missing/broken on this runner.
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          # Fail this step (not the next one) if the install did not land.
          "$HOME/.nix-profile/bin/nix" --version || {
            echo "::error::nix missing after install"
            ls -la "$HOME" || true
            ls -la /nix || true
            exit 1
          }

      - name: Build package
        run: |
          command -v nix || { echo "::error::nix not on PATH: $PATH"; exit 99; }
          nix build ".#packages.${{ matrix.system }}.dupe-finder" --print-build-logs

      # Every runner can execute its own native binary; --help exits before
      # any GUI init but exercises the full Python/PySide6 import chain.
      # `result` (no dot): nix build's symlink name for multi-output pkgs.
      - name: Smoke test
        run: ./result/bin/dupe-finder --help
