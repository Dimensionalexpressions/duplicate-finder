name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d+\.') { $v = (Get-Content version.txt -Raw).Trim() }
          "version=$v" >> "$env:GITHUB_OUTPUT"

      - name: Set up Python 3.12 (PySide6 + Pillow have current win64 wheels)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySide6, Pillow, PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 Pillow "pyinstaller>=6,<7"

      - name: Download ffmpeg win64 (BtbN master-latest) into windows/vendor/
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-dl -Force
          $bin = Get-ChildItem -Path ffmpeg-dl -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path windows\vendor | Out-Null
          Copy-Item (Join-Path $bin.FullName "bin/ffmpeg.exe")  windows\vendor\
          Copy-Item (Join-Path $bin.FullName "bin/ffprobe.exe") windows\vendor\
          Remove-Item ffmpeg.zip, ffmpeg-dl -Recurse -Force
          Get-Item windows\vendor\ffmpeg.exe, windows\vendor\ffprobe.exe | Format-Table Name, Length

      - name: Download poppler win64 (pdftotext/pdftoppm) into windows/vendor/poppler/
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip" -OutFile poppler.zip
          Expand-Archive -Path poppler.zip -DestinationPath poppler-dl -Force
          New-Item -ItemType Directory -Force -Path windows\vendor\poppler | Out-Null
          $bin = Get-ChildItem -Path poppler-dl -Directory | Select-Object -First 1
          Copy-Item -Path (Join-Path $bin.FullName "Library/bin/*") -Destination windows\vendor\poppler\
          Remove-Item poppler.zip, poppler-dl -Recurse -Force
          Get-Item windows\vendor\poppler\pdftotext.exe, windows\vendor\poppler\pdftoppm.exe | Format-Table Name, Length

      - name: Download tesseract win64 + eng tessdata into windows/vendor/tesseract/
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe" -OutFile tess.exe
          Start-Process -FilePath tess.exe -ArgumentList "/S" -Wait   # default dir (C:\Program Files\Tesseract-OCR)
          Remove-Item tess.exe
          New-Item -ItemType Directory -Force -Path "windows\vendor\tesseract" | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\tesseract.exe" windows\vendor\tesseract\
          Copy-Item "C:\Program Files\Tesseract-OCR\*.dll" windows\vendor\tesseract\
          New-Item -ItemType Directory -Force -Path "windows\vendor\tesseract\tessdata" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "windows\vendor\tesseract\tessdata\eng.traineddata"
          Get-Item windows\vendor\tesseract\tesseract.exe, windows\vendor\tesseract\tessdata\eng.traineddata | Format-Table Name, Length

      - name: Build onedir (PyInstaller, windowed, bundled tools + ICU shim)
        shell: pwsh
        working-directory: windows
        run: python build_windows.py

      - name: Locate signtool (Windows Kits) and export path
        shell: pwsh
        env:
          CERT_P12_B64: ${{ secrets.CERT_P12_B64 }}
        run: |
          $sn = $null
          $kits = "C:\Program Files (x86)\Windows Kits\10\bin"
          if (Test-Path $kits) {
            foreach ($d in (Get-ChildItem $kits -Directory | Where-Object Name -match '^\d' | Sort-Object Name -Descending)) {
              $c = Join-Path $d.FullName "x64\signtool.exe"
              if (Test-Path $c) { $sn = $c; break }
            }
          }
          if (-not $sn) {
            $c = Get-Command signtool -ErrorAction SilentlyContinue
            if ($c) { $sn = $c.Source }
          }
          # 'secrets' is not readable in a step 'if:' — so the presence of
          # the cert is checked here (env IS allowed to read secrets):
          # with a cert, signtool is required; without one, signing is
          # skipped by the steps below and a missing signtool is fine.
          if ($env:CERT_P12_B64) {
            if (-not $sn) { throw "signtool.exe not found (required for signing)" }
            Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL=$sn"
          }
          Write-Host "signtool: $sn"

      - name: Authenticode sign binaries (only when CERT_P12_B64 secret exists)
        shell: pwsh
        env:
          CERT_P12_B64: ${{ secrets.CERT_P12_B64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          $dir = "windows\dist\dupe_finder"
          if ([string]::IsNullOrWhiteSpace($env:CERT_P12_B64)) {
            Write-Host "signing skipped (no cert secret)"
            exit 0
          }
          [IO.File]::WriteAllBytes("cert.p12", [Convert]::FromBase64String($env:CERT_P12_B64))
          # Trust the (self-signed) root so signtool verify /pa can chain it.
          $pw = ConvertTo-SecureString $env:CERT_P12_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath cert.p12 -CertStoreLocation Cert:\LocalMachine\Root -Password $pw | Out-Null
          Write-Host "trusted root imported"
          Get-ChildItem -Path $dir -Recurse -Include *.exe, *.dll | ForEach-Object {
            Write-Host "signing $($_.FullName)"
            & $env:SIGNTOOL sign /f cert.p12 /p $env:CERT_P12_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $($_.FullName)" }
          }
          Write-Host "signed $((Get-ChildItem -Path $dir -Recurse -Include *.exe, *.dll | Measure-Object).Count) binaries"

      - name: Zip onedir output (with license + third-party notices)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ship | Out-Null
          Copy-Item windows\dist\dupe_finder ship\ -Recurse
          Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.md ship\
          $z = "dupe-finder-${{ steps.ver.outputs.version }}-win64.zip"
          Compress-Archive -Path "ship\*" -DestinationPath $z
          Remove-Item ship -Recurse
          Get-Item $z | Format-Table Name, Length

      - name: Authenticode sign zip + verify (only when cert exists)
        shell: pwsh
        env:
          CERT_P12_B64: ${{ secrets.CERT_P12_B64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_P12_B64)) {
            Write-Host "signing skipped (no cert secret)"
            exit 0
          }
          if (-not (Test-Path cert.p12)) {
            [IO.File]::WriteAllBytes("cert.p12", [Convert]::FromBase64String($env:CERT_P12_B64))
          }
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          Write-Host "signing $($zip.FullName)"
          & $env:SIGNTOOL sign /f cert.p12 /p $env:CERT_P12_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $zip.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $($zip.FullName)" }
          Write-Host "=== signtool verify /pa /v ==="
          & $env:SIGNTOOL verify /pa /v "windows\dist\dupe_finder\dupe_finder.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }
          Remove-Item cert.p12 -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dupe-finder-${{ steps.ver.outputs.version }}-win64
          path: dupe-finder-${{ steps.ver.outputs.version }}-win64.zip
          if-no-files-found: error
